name: URL Shortener Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/URLShortner/api/**"
      - ".github/workflows/url-shortener-api-deploy.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/URLShortner/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run Tests
        run: ./mvnw clean verify

      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.URL_SHORTENER_RENDER_DEPLOY_HOOK }}"
