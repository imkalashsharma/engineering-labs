name: URL Shortener Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/URLShortner/api/**"
      - ".github/workflows/url-shortener-api-deploy.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/URLShortner/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build
        run: ./mvnw clean verify

      - name: Trigger Render
        run: curl -X POST ${{ secrets.CHAT_API_DEPLOY_HOOK }}
