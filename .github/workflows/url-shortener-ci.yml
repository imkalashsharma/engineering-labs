name: URL Shortener CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/URLShortner/api/**"
      - ".github/workflows/url-shortener-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/URLShortner/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: mvn clean verify
