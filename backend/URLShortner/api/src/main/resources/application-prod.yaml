spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  baseUrl: ${BASE_URL}
  cors:
    allowed-origins:
      - https://your-production-frontend.com

logging:
  level:
    root: INFO
    com.zaxxer.hikari: DEBUG